# Edge reverse proxy — TLS termination for homework-shkola.ru
# Runs on the standard nginx:alpine image (root master / unprivileged "nginx" worker
# processes) rather than nginx-unprivileged, because it needs to bind ports 80/443
# (<1024, requires a privileged process or NET_BIND_SERVICE) and read root-owned
# Let's Encrypt private key material — the same posture used by virtually every
# TLS-terminating nginx/ingress deployment. Actual HTTP request parsing still runs in
# the unprivileged "nginx" worker processes, which is the real security boundary.

client_max_body_size 55m;
proxy_read_timeout 90s;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Docker's embedded DNS. proxy_pass targets below use variables (not bare
# hostnames) so nginx re-resolves via this resolver on each cache expiry
# instead of caching the upstream container's IP for the life of the worker
# process — otherwise a container recreated by a deploy (new internal IP)
# leaves nginx stuck retrying the old IP with "connection refused" until
# nginx is manually reloaded.
resolver 127.0.0.11 valid=10s;

server {
    listen 80;
    server_name homework-shkola.ru www.homework-shkola.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Container HEALTHCHECK hits this over plain HTTP; excluded from the HTTPS
    # redirect below so it doesn't chase a TLS handshake against 127.0.0.1
    # (whose hostname doesn't match the homework-shkola.ru cert).
    location = /healthz {
        return 200 "ok";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name homework-shkola.ru www.homework-shkola.ru;

    ssl_certificate     /etc/letsencrypt/live/homework-shkola.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/homework-shkola.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
    gzip_min_length 1024;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # SSE — no buffering, long-lived connection.
    location /api/events {
        set $backend_api backend-api:3001;
        proxy_pass http://$backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        chunked_transfer_encoding on;
    }

    # Textbook PDF uploads (upload-pdf, reindex): stream the request body straight
    # to backend-api instead of nginx fully buffering it to disk first. With
    # buffering on, a large/slow upload sits in nginx's client_temp the whole time
    # before backend even sees the first byte — on a slow client uplink that can
    # hold the connection open long enough that the browser's HTTP/2 keepalive PING
    # goes unanswered and it kills the whole connection (aborts every other
    # in-flight request multiplexed on it too, not just the upload).
    location ~ ^/api/textbooks/(upload-pdf|[^/]+/reindex)$ {
        set $backend_api backend-api:3001;
        proxy_pass http://$backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
    }

    location /api/ {
        set $backend_api backend-api:3001;
        proxy_pass http://$backend_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location /queues {
        set $backend_api backend-api:3001;
        proxy_pass http://$backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        set $frontend_upstream frontend:8080;
        proxy_pass http://$frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
