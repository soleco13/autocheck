name: autocheck

networks:
  autocheck_net:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  covers:
  certbot-etc:
  certbot-webroot:

services:
  postgres:
    container_name: autocheck-postgres
    image: pgvector/pgvector:pg16
    restart: always
    environment:
      POSTGRES_DB: autocheck
      POSTGRES_USER: autocheck
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autocheck -d autocheck"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [autocheck_net]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  redis:
    container_name: autocheck-redis
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks: [autocheck_net]
    security_opt: ["no-new-privileges:true"]
    # Not cap_drop: ALL — the official image's entrypoint starts as root and uses
    # setuid/setgid to drop to the "redis" user for the actual server process; that
    # privilege drop itself needs CAP_SETUID/CAP_SETGID. The server process still
    # ends up running as non-root.
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  backend-api:
    build: ./backend
    image: autocheck-backend:latest
    restart: always
    env_file: .env
    environment:
      PORT: 3001
      INLINE_WORKER: "false"
    command: ["node", "dist/server.js"]
    volumes:
      - covers:/app/covers
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3001/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [autocheck_net]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  backend-worker:
    build: ./backend
    image: autocheck-backend:latest
    restart: always
    env_file: .env
    environment:
      INLINE_WORKER: "false"
    command: ["node", "dist/worker.js"]
    volumes:
      - covers:/app/covers
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    # The image's Dockerfile HEALTHCHECK probes :3001/api/health, which only exists
    # on the server.js process — disable it here so autoheal doesn't loop-restart
    # this container (worker.js has no HTTP server to probe).
    healthcheck:
      disable: true
    networks: [autocheck_net]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  frontend:
    build: ./frontend
    image: autocheck-frontend:latest
    restart: always
    depends_on:
      - backend-api
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [autocheck_net]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  nginx:
    container_name: autocheck-nginx
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # DNS now points here and the cert is issued — running the full HTTPS config
      # (deploy/nginx/nginx.conf). See DEPLOYMENT.md for history.
      - ./deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-etc:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot:ro
    depends_on:
      - backend-api
      - frontend
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:80/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [autocheck_net]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Not part of `docker compose up -d` — invoked on-demand via `docker compose run
  # --rm certbot <args>` for initial issuance and renewal (cron). No restart policy
  # needed since it's a one-shot command, not a long-running service.
  certbot:
    container_name: autocheck-certbot
    image: certbot/certbot:latest
    profiles: ["tools"]
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot

  autoheal:
    image: willfarrell/autoheal:latest
    restart: always
    environment:
      AUTOHEAL_CONTAINER_LABEL: all
      AUTOHEAL_INTERVAL: 30
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [autocheck_net]

  # Auto-updates base images pulled from upstream registries (redis, nginx, certbot).
  # Deliberately excludes postgres (stateful DB — unattended major-version image bumps
  # are a real data-safety risk) and the custom-built backend/frontend images (those
  # have no upstream tag to pull; updates go through scripts/deploy.sh instead, which
  # keeps a :previous tag for rollback). Runs once daily at 04:00.
  watchtower:
    image: containrrr/watchtower:latest
    restart: always
    environment:
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_SCHEDULE: "0 0 4 * * *"
      WATCHTOWER_LABEL_ENABLE: "false"
      DOCKER_API_VERSION: "1.44"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: ["autocheck-redis", "autocheck-nginx", "autocheck-certbot"]
    networks: [autocheck_net]
